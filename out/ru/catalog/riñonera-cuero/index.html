 и это единственный известный нам способ, чтобы шов не разошёлся через двадцать лет.\",\"signature\":\"Медельин, Колумбия\"},\"materials\":{\"label\":\"Материал\",\"title\":[\"Через дверь\",\"входят\",\"четыре вещи\"],\"lead\":\"Больше ничего. Ни синтетического подклада, ни клея вместо шва, ни штампованной фурнитуры, которая облезет через два года.\",\"spine\":\"Лицевая кожа · Антьокия\",\"items\":[{\"name\":\"Лицевая кожа\",\"origin\":\"Антьокия\",\"note\":\"Наружный слой шкуры, с нетронутым мереем. Его не шлифуют и не корректируют: рубцы и отметины животного остаются на месте.\"},{\"name\":\"Растительное дубление\",\"origin\":\"Акация и кебрачо\",\"note\":\"Сорок пять дней в чане вместо двух в барабане. Это долго, это дорого, и поэтому кожа темнеет, а не трескается.\"},{\"name\":\"Вощёный лён\",\"origin\":\"0,45 и 0,55 мм\",\"note\":\"Скорее порвётся кожа, чем шов. А если один стежок сдаст, седельный шов не даст разойтись всему ряду.\"},{\"name\":\"Цельная латунь\",\"origin\":\"Литьё вручную\",\"note\":\"Без покрытия и без штамповки. С годами темнеет, блеск можно вернуть. Хромированная фурнитура, когда облезет, уже не оживёт.\"}]},\"process\":{\"label\":\"Как делают\",\"title\":\"Шесть шагов, всегда в одном порядке\",\"lead\":\"Между первым и последним проходят дни, не часы. Кожа отдыхает между шагами: если её торопить, останется след.\",\"captions\":[\"Крой — один проход по краю.\",\"Шов — две иглы, одно отверстие за раз.\",\"Урез — дерево и трение, без лака.\"]},\"craftSteps\":[{\"step\":\"01\",\"title\":\"Отбор\",\"body\":\"Участок шкуры берут по тому, какую нагрузку ему держать. Хребет — на то, что тянется; пола — на то, что сгибается.\"},{\"step\":\"02\",\"title\":\"Крой\",\"body\":\"Круглый нож и картонная лекала. Один проход по краю: второй всегда виден на урезе.\"},{\"step\":\"03\",\"title\":\"Урезы\",\"body\":\"Снимают фаску, шлифуют тремя номерами и смачивают край, прежде чем к нему прикоснуться чем-либо ещё.\"},{\"step\":\"04\",\"title\":\"Шов\",\"body\":\"Седельный шов, две иглы, вощёный лён. Одно отверстие за раз, заранее наколотое шилом.\"},{\"step\":\"05\",\"title\":\"Натирка\",\"body\":\"Дерево и трение, пока урез перестанет брать воду и начнёт отдавать свет.\"},{\"step\":\"06\",\"title\":\"Отделка\",\"body\":\"Жир, сутки покоя и последняя проверка на просвет, стежок за стежком.\"}],\"marks\":[\"Ручной шов\",\"Лицевая кожа\",\"Малые партии\"],\"patina\":{\"label\":\"Время\",\"title\":\"Кожа меняется вместе с вами\",\"body\":\"Растительное дубление, без пигмента, который бы её закрыл. Из мастерской выходит светлой и темнеет от света, жира рук и трения дней. Три вещи внизу — одно и то же портмоне: только что сделанное, через год и через десять.\",\"years\":[{\"mark\":\"01\",\"label\":\"День один\",\"note\":\"Выходит светлым, почти сырым.\"},{\"mark\":\"02\",\"label\":\"Год один\",\"note\":\"Проступает мёд.\"},{\"mark\":\"03\",\"label\":\"Год десять\",\"note\":\"Тёмный янтарь, мерея на виду.\"}]},\"workshopTeaser\":{\"label\":\"Мастерская\",\"title\":\"Инструменты старше мастерской\",\"body\":\"Почти все — с рук. Круглый нож пришёл без рукояти и режет лучше любого, что продают сейчас. Их правят каждое утро, прежде чем трогать кожу.\",\"caption\":\"У каждого инструмента своё место. Всегда одно и то же.\"},\"enquiry\":{\"label\":\"Заказ\",\"title\":\"Кроят после разговора\",\"body\":\"Длину, мерки, цвет нити или фурнитуру можно изменить. Скажите, для чего будете носить, — и лекала правят до того, как тронут шкуру.\",\"note\":\"От пяти до пятнадцати дней на верстаке, смотря по вещи. Срок называют до начала работы.\"},\"catalog\":{\"title\":\"Вещи\",\"description\":\"Сумки, ремни и мелочь, кроенные и шитые вручную из кожи растительного дубления. У каждой — лист: кожа, дубление, нить, размеры и срок на верстаке.\",\"lead\":\"Каждая вещь сходит с одного верстака и несёт свой лист: какая кожа, как дублена, какой нитью шита и сколько дней занимает.\"},\"product\":{\"sheet\":\"Лист\",\"measurable\":\"То, что можно измери
